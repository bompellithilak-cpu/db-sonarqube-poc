# ---------------------------------------------------------------------------
# SonarCloud project configuration
# Read by sonar-scanner (and by the SonarSource GitHub Action) from the repo
# root. Values that are secret (the token) are NOT set here -- they come from
# GitHub Secrets at runtime.
# ---------------------------------------------------------------------------

# Unique project identifier in SonarCloud. Must match the project you created.
sonar.projectKey=bompellithilak-cpu_db-sonarqube-poc
# Your SonarCloud organisation key (Account -> Organizations).
sonar.organization=bompellithilak-cpu

# Human-readable name and version shown in the SonarCloud UI.
sonar.projectName=Databricks DQ Framework - CI/CD POC
sonar.projectVersion=1.0

# --- What to analyse -------------------------------------------------------
# Production code. Everything here counts towards ratings AND coverage.
sonar.sources=src,notebooks
# Test code. Analysed with test-specific rules and excluded from the
# coverage denominator -- otherwise your tests inflate your own coverage.
sonar.tests=tests

# Exclude the deliberate-violation template so the repo is green at rest.
# Rename it to violations.py for the failure demo and it WILL be scanned.
sonar.exclusions=**/*.template,**/__pycache__/**,**/.venv/**

# --- Coverage --------------------------------------------------------------
# Path to the Cobertura-format report produced by `pytest --cov-report=xml`.
sonar.python.coverage.reportPaths=coverage.xml

# --- Language settings -----------------------------------------------------
# Tells the analyser which Python version's syntax and deprecations apply.
sonar.python.version=3.11
sonar.sourceEncoding=UTF-8
